[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "voxfusion"
version = "0.1.0"
description = "Cross-platform audio capture, transcription, diarization, and translation system"
license = "GPL-2.0-only"
authors = ["VoxFusion Contributors"]
readme = "README.md"
homepage = "https://github.com/uboy/VoxFusion"
repository = "https://github.com/uboy/VoxFusion"
keywords = ["transcription", "speech-to-text", "diarization", "translation", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
packages = [{ include = "voxfusion", from = "src" }]

[tool.poetry.scripts]
voxfusion = "voxfusion.cli.main:main"
voxfusion-gui = "voxfusion.gui.main:main"

[tool.poetry.dependencies]
python = "^3.11"
faster-whisper = ">=1.0"
ctranslate2 = ">=4.0"
numpy = ">=1.24"
scipy = ">=1.7"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
click = ">=8.0"
sounddevice = ">=0.4"
soundfile = ">=0.12"
structlog = ">=23.0"
pyyaml = ">=6.0"
httpx = ">=0.24"
tqdm = ">=4.66"
typing-extensions = ">=4.13"
# GigaAM / HuggingFace model backends
# transformers 5.x changed model loading to meta-device init which breaks GigaAM's
# torchaudio.transforms.MelSpectrogram construction; GigaAM-v3 model card requires 4.57.x.
# Pin to 4.57+ until upstream fixes the meta-device issue.
transformers = ">=4.57,<5.0"
torch = ">=2.4"
# Parakeet (NeMo) backend (optional — adds ~2 GB)
nemo_toolkit = {version = ">=2.0", extras = ["asr"], optional = true}
# GigaAM extra deps (trust_remote_code model requires these at runtime)
torchaudio = { version = ">=2.4", optional = true }
sentencepiece = { version = ">=0.1.99", optional = true }
omegaconf = { version = ">=2.3", optional = true }
hydra-core = { version = ">=1.3", optional = true }
pyannote-audio = { version = ">=4.0", optional = true }
# torchcodec: required by GigaAM-v3 (pulled transitively by pyannote-audio, declared explicitly)
torchcodec = { version = ">=0.7", optional = true }

# Drag-and-drop support for the GUI file tab (optional — gracefully disabled when absent)
tkinterdnd2 = { version = ">=0.3", optional = true }
# Noise reduction (optional — lazy import in preprocessing/noise.py)
noisereduce = { version = ">=0.4", optional = true }
# Platform-specific dependencies
pyaudiowpatch = { version = ">=0.2.12", markers = "sys_platform == 'win32'" }
pulsectl = { version = ">=23.5", markers = "sys_platform == 'linux'", optional = true }
pyobjc-framework-CoreAudio = { version = ">=10.0", markers = "sys_platform == 'darwin'", optional = true }
pyobjc-framework-ScreenCaptureKit = { version = ">=10.0", markers = "sys_platform == 'darwin'", optional = true }

[tool.poetry.extras]
diarization = ["pyannote-audio", "torch"]
translation-offline = ["argostranslate"]
audio-quality = ["librosa", "soxr"]
noise-reduction = ["noisereduce"]
security = ["cryptography"]
dnd = ["tkinterdnd2"]
windows = ["pyaudiowpatch"]
linux = ["pulsectl"]
macos = ["pyobjc-framework-CoreAudio", "pyobjc-framework-ScreenCaptureKit"]
# GigaAM needs several packages beyond the default torch+transformers:
# torchaudio and sentencepiece are used by the model's trust_remote_code;
# omegaconf + hydra-core are config frameworks GigaAM depends on;
# pyannote.audio ≥ 4.0 + torchcodec ≥ 0.7 are required by GigaAM-v3 (November 2025+).
gigaam = ["torchaudio", "sentencepiece", "omegaconf", "hydra-core", "pyannote-audio", "torchcodec"]
# Parakeet/NeMo pulls torchaudio transitively but we declare it explicitly.
parakeet = ["nemo_toolkit", "torchaudio"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
pytest-cov = ">=4.0"
ruff = ">=0.1"
mypy = ">=1.5"
pip-audit = ">=2.6"
pre-commit = ">=3.0"
pyinstaller = { version = ">=6.15", python = ">=3.11,<3.15" }

# Optional extras (declared here so poetry resolves them)
[tool.poetry.group.diarization]
optional = true

[tool.poetry.group.diarization.dependencies]
pyannote-audio = ">=3.1"
torch = ">=2.0"

[tool.poetry.group.translation-offline]
optional = true

[tool.poetry.group.translation-offline.dependencies]
argostranslate = ">=1.9"

[tool.poetry.group.audio-quality]
optional = true

[tool.poetry.group.audio-quality.dependencies]
librosa = ">=0.10"
soxr = ">=0.3"

[tool.poetry.group.security]
optional = true

[tool.poetry.group.security.dependencies]
cryptography = ">=41.0"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    # --- Intentional patterns in this codebase ---
    "PLC0415",  # import not at top-level: used deliberately for lazy/optional heavy deps
    "E402",     # module-level import not at top: same reason (platform guards, runtime shims)
    "PLR0912",  # too many branches: complex pipeline control flow
    "PLR0911",  # too many return statements: same
    "PLR0915",  # too many statements: large functions in GUI/pipeline layers
    "PLW0108",  # unnecessary lambda: sometimes needed for typing in callbacks
    "RUF046",   # unnecessary cast: false positives with structural typing
    # --- Russian/Unicode strings in user-facing messages ---
    "RUF001",   # ambiguous Cyrillic chars: intentional Russian user-facing strings
    "RUF002",   # ambiguous chars in docstrings: same
    "RUF003",   # ambiguous chars in comments: same
    # --- Line length: long strings/URLs in docstrings/comments are acceptable ---
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["voxfusion"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
packages = ["voxfusion"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "sounddevice.*",
    "soundfile.*",
    "pyannote.*",
    "argostranslate.*",
    "pycaw.*",
    "pulsectl.*",
    "noisereduce.*",
    "soxr.*",
    "librosa.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require models or external resources",
    "hardware: marks tests that require real local audio devices and optional local model assets",
    "platform: marks tests that are platform-specific",
    "slow: marks tests that take > 5 seconds",
    "download: marks tests that actively download models from the internet",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/voxfusion"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
