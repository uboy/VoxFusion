name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev deps
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            ruff mypy \
            types-PyYAML types-tqdm

      - name: Install package (editable, no deps)
        run: pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install OS packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libportaudio2

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            cryptography

      - name: Install package (editable, no deps)
        run: pip install --no-deps -e .

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          python -c "import torch, ctranslate2, sounddevice, numpy; print('native extensions OK')"
          xvfb-run pytest tests/unit/ -q --tb=short
