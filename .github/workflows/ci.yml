name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev deps
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            ruff mypy \
            types-PyYAML types-tqdm

      - name: Install package (editable)
        run: pip install -e .

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install OS packages for GUI tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            cryptography

      - name: Install package (editable)
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov pytest-xdist

      - name: Sanity-check native extensions
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import ctranslate2; print('ctranslate2', ctranslate2.__version__)"
          python -c "import sounddevice; print('sounddevice', sounddevice.__version__)"
          python -c "import tkinter; print('tkinter OK')"
          python -c "from voxfusion.version import __version__; print('voxfusion', __version__)"

      - name: Run unit tests
        run: |
          xvfb-run pytest tests/unit/ \
            -q --tb=short \
            --cov=voxfusion --cov-report=term-missing \
            --cov-fail-under=70
