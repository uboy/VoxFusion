name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev deps
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            ruff mypy \
            types-PyYAML types-tqdm

      - name: Install package (editable, no deps)
        run: pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src/

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install OS packages for GUI and audio tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libportaudio2

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            faster-whisper ctranslate2 numpy scipy pydantic pydantic-settings \
            click sounddevice soundfile structlog pyyaml httpx tqdm \
            typing-extensions "transformers>=4.48,<5.0" \
            cryptography

      - name: Install package (editable, no deps)
        run: pip install --no-deps -e .

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov pytest-xdist

      - name: Check numpy
        run: python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Check torch
        run: python -c "import torch; print('torch', torch.__version__)"
      - name: Check ctranslate2
        run: python -c "import ctranslate2; print('ctranslate2', ctranslate2.__version__)"
      - name: Check sounddevice
        run: python -c "import sounddevice; print('sounddevice', sounddevice.__version__)"
      - name: Check tkinter
        run: python -c "import tkinter; print('tkinter OK')"
      - name: Check voxfusion
        run: python -c "import voxfusion; print('voxfusion OK')"
      - name: Check gui.main
        run: python -c "from voxfusion.gui.main import TranscriptionGUI; print('gui.main OK')"

      - name: Collect tests
        run: xvfb-run pytest tests/unit/ --co -q 2>&1 | tail -5

      - name: Run unit tests (no coverage, for crash diagnosis)
        run: |
          xvfb-run pytest tests/unit/ \
            -q --tb=short \
            -x --no-header 2>&1 | tail -30
